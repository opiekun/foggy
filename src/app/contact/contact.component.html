<div class="tab-content-container">
    <div class="add-friend-dialog">
        <h2>Add a Contact</h2>
        <div class="add-friend-content">
            <p>Enter your message to reach out to Foggy:</p>
            <input type="text" class="add-friend-input" placeholder="Your Name" aria-label="Your Name">
            <input type="email" class="add-friend-input" placeholder="Your Email"
                aria-label="Your Email" style="margin-top: 10px;">
            <textarea class="add-friend-input" placeholder="Type message..." rows="4"
                style="margin-top: 10px; resize: none;" aria-label="Message"></textarea>
            <div class="add-friend-buttons">
                <button class="play-btn">SEND MESSAGE</button>
                <button class="action-btn">CANCEL</button>
            </div>
        </div>
    </div>
</div>
